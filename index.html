 1fr;gap:10px;align-items:center;text-align:center;margin:16px 0}.score strong{font-size:12px}.score span{font-size:39px;font-weight:950;white-space:nowrap}.commentary{background:#091b2a;padding:12px;border-radius:10px;height:180px;overflow:auto}.commentary p{font-size:12px;color:#bcd0db}@media(max-width:1100px){.side{width:195px}.marketgrid,.facilitygrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.side{display:none}.top{height:72px;padding:0 15px}main{padding:22px 16px 115px}.hero,.g2{grid-template-columns:1fr}.bottom{position:fixed;display:flex;bottom:0;left:0;right:0;z-index:10;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#102236;justify-content:space-around;gap:3px}.tab{background:none;border:0;color:#9cb1c4;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;font-size:10px;font-weight:800;padding:6px 2px}.tab span{font-size:20px}.toast{bottom:100px}}@media(max-width:540px){.club strong{font-size:14px}.club small{font-size:10px}.shield{width:38px;height:44px;font-size:11px}.wallet{padding:9px 11px}.wallet strong{font-size:19px}.wallet small{font-size:8px}.head{display:block}.head .btn{margin-top:12px}.head h2{font-size:29px}.hero{padding:21px}.hero h2{font-size:30px}.g3,.marketgrid,.facilitygrid{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px}.pitch{min-height:340px}.pitchplayer{width:58px}.pitchplayer span{font-size:9px}.player{grid-template-columns:35px minmax(0,1fr) 28px auto;gap:5px}.player b{font-size:11px}.score span{font-size:31px}.dialog{padding:17px}}</style></head><body><div id="root"></div><div id="modal"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>(function app(){
"use strict";
const KEY="sideline26_v3";
const NAV=[["home","Übersicht","🏠"],["team","Kader & Taktik","👕"],["market","Transfers","🔁"],["training","Training","💪"],["club","Vereinsausbau","🏟️"],["league","Liga","🏆"],["history","Historie","📅"],["settings","Einstellungen","⚙️"]];
const CLUBS=[["Nordhafen 04",76],["Viktoria Berlin-West",73],["SV Grünstadt",72],["Blau-Weiß 1910",79],["Fortuna Adler",75],["Union Kronberg",77],["FC Eichenwald",71],["Athletik Süd",70],["Sportfreunde Rhein",74]];
const FIRST=["Luca","Ben","Mats","Jonas","Timo","Noah","Finn","Emil","Julian","Nils","Max","Felix","Paul","Tom","Elias","David","Adrian","Samuel","Leon","Nico","Rafael","Fabio","Oskar","Bruno","Anton","Milan"];
const LAST=["Keller","Winter","Becker","Albrecht","Wagner","Krause","Schneider","Fischer","Hartmann","Neumann","Voss","Brandt","König","Weber","Roth","Hoffmann","Schäfer","Richter","Meyer","Sommer","Ritter","Franke","Peters","Baumann","Engel"];
const FORM={"4-3-3":{GK:1,DEF:4,MID:3,ATT:3},"4-4-2":{GK:1,DEF:4,MID:4,ATT:2},"3-5-2":{GK:1,DEF:3,MID:5,ATT:2},"4-2-3-1":{GK:1,DEF:4,MID:5,ATT:1}};
const FAC=[["stadium","🏟️","Stadion","Mehr Fans und Einnahmen.",220000],["training","💪","Trainingszentrum","Spieler entwickeln sich schneller.",165000],["academy","🌱","Jugendakademie","Fördert neue Talente.",185000],["medical","🏥","Medizinzentrum","Erhöht die Regeneration.",145000],["scouting","🔎","Scouting","Entdecke stärkere Profis.",125000],["marketing","📣","Fan-Marketing","Steigert deine Fanbasis.",135000]];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],clamp=(a,min,max)=>Math.min(max,Math.max(min,a)),fmt=a=>Math.round(a).toLocaleString("de-DE");
const e=a=>String(a).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let s,page="home",marketPos="ALL",search="",match=null,toastTimer=null;
function mkPlayer(pos,min=62,max=84){let rating=rnd(min,max);return {id:"p"+Math.random().toString(36).slice(2,12),name:pick(FIRST)+" "+pick(LAST),pos,rating,age:rnd(17,33),fitness:rnd(85,100),potential:clamp(rating+rnd(2,15),rating,99),goals:0}}
function price(p){return Math.round((Math.pow(p.rating/70,4)*800000+Math.max(0,24-p.age)*50000)/5000)*5000}
function bestXI(){let out=[];for(let [pos,n] of Object.entries(FORM[s.formation]))s.roster.filter(p=>p.pos===pos).sort((a,b)=>b.rating-a.rating).slice(0,n).forEach(p=>out.push(p.id));s.roster.filter(p=>!out.includes(p.id)).sort((a,b)=>b.rating-a.rating).forEach(p=>{if(out.length<11)out.push(p.id)});return out}
function marketPlayers(){return Array.from({length:18},()=>mkPlayer(pick(["GK","DEF","DEF","MID","MID","ATT","ATT"]),64,Math.min(97,85+s.facilities.scouting*2)))}
function fixtures(){let arr=s.clubs.map(c=>c.id),rounds=[];for(let r=0;r<9;r++){let games=[];for(let i=0;i<5;i++){let p=[arr[i],arr[9-i]];games.push((r+i)%2?p.reverse():p)}rounds.push(games);arr=[arr[0],arr[9],...arr.slice(1,9)]}return rounds.concat(rounds.map(g=>g.map(([a,b])=>[b,a])))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(err){}}
function newGame(){let pos=["GK","GK","DEF","DEF","DEF","DEF","DEF","DEF","MID","MID","MID","MID","MID","MID","ATT","ATT","ATT","ATT"];s={version:3,name:"Rhein City FC",color:"#278b94",infinite:true,cash:2000000,season:2026,week:0,fans:1750,trophies:0,formation:"4-3-3",tactic:"Kontrolle",focus:"Technik",roster:pos.map((p,i)=>mkPlayer(p,i<11?67:61,i<11?82:76)),starters:[],market:[],clubs:[{id:"me",name:"Rhein City FC",strength:74},...CLUBS.map((x,i)=>({id:"c"+i,name:x[0],strength:x[1]}))],schedule:[],table:{},facilities:{stadium:1,training:1,academy:1,medical:1,scouting:1,marketing:1},sponsor:"Stadtwerke Nova",history:[],news:["🚀 Willkommen bei Rhein City FC!"]};for(let c of s.clubs)s.table[c.id]={played:0,w:0,d:0,l:0,for:0,against:0,points:0};s.schedule=fixtures();s.starters=bestXI();s.market=marketPlayers();save()}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.version===3&&Array.isArray(d.roster)&&d.roster.length>=11&&Array.isArray(d.schedule)&&d.table){s=d;return}}catch(err){}newGame()}
function strength(){let a=s.starters.map(id=>s.roster.find(p=>p.id===id)).filter(Boolean);return Math.round(a.reduce((x,p)=>x+p.rating*(.75+.25*p.fitness/100),0)/Math.max(1,a.length)+.4*s.facilities.training)}
function sorted(){return [...s.clubs].sort((a,b)=>s.table[b.id].points-s.table[a.id].points||(s.table[b.id].for-s.table[b.id].against)-(s.table[a.id].for-s.table[a.id].against))}
function upcoming(){let f=s.schedule[s.week]?.find(a=>a.includes("me"));return f?{f,opponent:s.clubs.find(c=>c.id===(f[0]==="me"?f[1]:f[0])),home:f[0]==="me"}:null}
function h(label,title,sub,right=""){return `<div class="head"><div><div class="kicker">${label}</div><h2>${title}</h2><p>${sub}</p></div>${right}</div>`}
function button(id,label){return `<button class="btn small" data-page="${id}">${label}</button>`}
function layout(content){let nav=NAV.map(([id,label,ico])=>`<button class="navbutton ${page===id?"sel":""}" data-page="${id}"><span>${ico}</span>${label}</button>`).join("");let mn=NAV.filter(x=>["home","team","market","league","club","settings"].includes(x[0])).map(([id,label,ico])=>`<button class="tab ${(page===id||(id==="settings"&&["training","history"].includes(page)))?"sel":""}" data-page="${id}"><span>${ico}</span>${({home:"Home",team:"Kader",market:"Transfers",club:"Verein",league:"Liga",settings:"Mehr"})[id]}</button>`).join("");return `<div class="layout"><aside class="side"><div class="logo"><b>↗</b><div>SIDE<strong>LINE 26</strong><small>FOOTBALL MANAGER</small></div></div><nav>${nav}</nav><div class="note">♾️ UNBEGRENZTE MÜNZEN<br><small>Keine Paywall. Keine Wartezeit.</small></div></aside><div class="work"><header class="top"><div class="club"><span class="shield" style="--cc:${e(s.color)}">RFC</span><div><strong>${e(s.name)}</strong><small>Saison ${s.season}/${s.season+1} · Spieltag ${s.week+1}/18</small></div></div><div class="wallet"><small>🪙 MÜNZEN</small><strong>${s.infinite?"∞":fmt(s.cash)}</strong></div></header><main>${content}</main></div></div><nav class="bottom">${mn}</nav>`}
function standings(){return `<div class="scroll"><table><thead><tr><th>#</th><th>Verein</th><th>SP</th><th>TD</th><th>PKT</th></tr></thead><tbody>${sorted().map((c,i)=>{let t=s.table[c.id],d=t.for-t.against;return `<tr class="${c.id==="me"?"me":""}"><td>${i+1}.</td><td><b>${e(c.id==="me"?s.name:c.name)}</b></td><td>${t.played}</td><td>${d>0?"+":""}${d}</td><td>${t.points}</td></tr>`}).join("")}</tbody></table></div>`}
function pitch(){let y={GK:88,DEF:67,MID:43,ATT:17};let items=[];for(let [pos,n] of Object.entries(FORM[s.formation])){let group=s.starters.map(id=>s.roster.find(p=>p.id===id)).filter(p=>p?.pos===pos).sort((a,b)=>b.rating-a.rating);for(let i=0;i<n;i++){let p=group[i];if(p)items.push(`<div class="pitchplayer" style="left:${(i+1)*100/(n+1)}%;top:${y[pos]}%"><b>${p.rating}</b><span>${e(p.name.split(" ").pop())}</span></div>`)}}return `<div class="pitch">${items.join("")}</div>`}
function home(){let next=upcoming();let rank=sorted().findIndex(c=>c.id==="me")+1;let stats=[["🏆 Tabellenplatz",rank+" / 10",s.table.me.points+" Punkte"],["⚡ Teamstärke",strength(),s.formation],["🎟️ Fans",fmt(s.fans),"Dein Rückhalt wächst"],["🥇 Titel",s.trophies,"Deine Trophäen"]];return h("MANAGERZENTRALE","Die Saison gehört dir.","Baue dein Dreamteam und führe deinen Verein an die Spitze.")+`<div class="hero"><div><span class="pill">♾️ ${s.infinite?"UNBEGRENZT MÜNZEN":"KLASSISCHER MODUS"}</span><h2>Große Träume.<br><em>Keine Grenzen.</em></h2><p>Verpflichte Stars, trainiere Talente und dominiere die Liga. Dein Verein, deine Regeln!</p><button class="btn primary" data-page="market">⭐ Topspieler verpflichten →</button></div><div class="fixture"><span class="kicker">${next?.home?"Heimspiel":"Auswärtsspiel"} · ${s.week+1}. Spieltag</span><div>${e(s.name)}</div><strong>VS</strong><div>${e(next?.opponent.name||"Nächster Gegner")}</div><p>Gegnerstärke ${next?.opponent.strength||"-"}</p><button class="btn primary" data-action="kickoff">▶ Spieltag starten</button></div></div><div class="grid g4">${stats.map(([label,note,sub])=>`<div class="card stat"><div>${label}</div><strong>${note}</strong><small>${sub}</small></div>`).join("")}</div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="between"><h3>👕 Deine Startelf</h3>${button("team","Taktik ändern →")}</div>${pitch()}<p class="muted smalltxt">Formation ${s.formation} · ${e(s.tactic)}</p></div><div class="grid"><div class="card"><div class="between"><h3>🏆 Ligatabelle</h3>${button("league","Alle →")}</div>${standings()}</div><div class="card"><h3>⚡ Schnellzugriff</h3><div class="grid g2">${[["training","💪 Training"],["club","🏟️ Ausbau"],["market","🔎 Scouting"],["history","📅 Ergebnisse"]].map(([id,n])=>`<button class="btn" data-page="${id}">${n}</button>`).join("")}</div></div></div></div>`}
function team(){let roster=[...s.roster].sort((a,b)=>Number(s.starters.includes(b.id))-Number(s.starters.includes(a.id))||b.rating-a.rating);return h("KADERVERWALTUNG","Dein Team. Deine Regeln.","Wähle Taktik, Formation und deine Startelf.",'<button class="btn primary" data-action="best">✨ Beste Elf</button>')+`<div class="grid g2"><div class="card"><div class="between"><h3>⚽ Aufstellung & Taktik</h3><span class="pill">OVR ${strength()}</span></div><div class="controls"><label><small>FORMATION</small><select id="formation">${Object.keys(FORM).map(x=>`<option ${s.formation===x?"selected":""}>${x}</option>`).join("")}</select></label><label><small>SPIELSTIL</small><select id="tactic">${["Kontrolle","Pressing","Konter","Offensiv","Defensiv"].map(x=>`<option ${s.tactic===x?"selected":""}>${x}</option>`).join("")}</select></label></div>${pitch()}</div><div class="card"><div class="between"><h3>Kaderübersicht</h3><span class="pill">${s.roster.length} Spieler</span></div><div class="roster">${roster.map(p=>{let active=s.starters.includes(p.id);return `<div class="player"><span class="pos ${p.pos}">${p.pos}</span><div><b>${e(p.name)}</b><small>${p.age} Jahre · ${p.fitness}% Fitness ${active?"⭐":""}</small></div><strong>${p.rating}</strong><button class="btn small" data-action="${active?"bench":"start"}" data-id="${p.id}">${active?"Bank":"Start"}</button></div>`}).join("")}</div></div></div>`}
function cards(){let list=s.market.filter(p=>(marketPos==="ALL"||p.pos===marketPos)&&p.name.toLowerCase().includes(search.toLowerCase()));return list.length?list.map(p=>`<article class="marketcard"><div class="between"><div><strong class="big">${p.rating}</strong><small>${p.pos}</small></div><span class="pill">${p.rating>=88?"⭐ ELITE":p.age<=22?"🌱 TALENT":"PROFI"}</span></div><h3>${e(p.name)}</h3><p class="muted smalltxt">${p.age} Jahre · Potenzial ${p.potential} · Fitness ${p.fitness}%</p><div class="between"><span class="price">${fmt(price(p))} 🪙</span><button class="btn primary small" data-action="buy" data-id="${p.id}">Kaufen →</button></div></article>`).join(""):`<div class="card muted">Keine Spieler gefunden.</div>`}
function market(){return h("TRANSFERZENTRALE","Die Stars warten auf dich.","Verpflichte Talente und Weltklasse-Spieler.",'<button class="btn" data-action="refresh">🔄 Neue Spieler</button>')+`<div class="card budget"><div><small>TRANSFERBUDGET</small><strong>${s.infinite?"∞ Münzen":fmt(s.cash)+" Münzen"}</strong></div><span class="pill">${s.roster.length}/35 Kaderplätze</span></div><div class="filters">${[["ALL","Alle"],["GK","Tor"],["DEF","Abwehr"],["MID","Mittelfeld"],["ATT","Sturm"]].map(([p,label])=>`<button class="${marketPos===p?"sel":""}" data-action="filter" data-id="${p}">${label}</button>`).join("")}<input id="marketsearch" aria-label="Spieler suchen" placeholder="🔎 Spieler suchen" value="${e(search)}"></div><div id="marketcards" class="marketgrid">${cards()}</div>`}
function training(){let modes=[["Technik","🎯","Verbessert die Stärke deiner Spieler."],["Fitness","⚡","Stellt die Fitness wieder her."],["Abschluss","🥅","Trainiert Angreifer."],["Verteidigung","🛡️","Trainiert Torhüter und Verteidiger."],["Jugend","🌱","Fördert Nachwuchsspieler bis 22 Jahre."]];return h("TRAINING","Jeden Tag ein bisschen besser.","Du kannst so oft trainieren, wie du möchtest.")+`<div class="grid g2"><div class="card"><h3>💪 Einheiten</h3>${modes.map(([name,ico,d])=>`<div class="option"><div class="between"><div><b>${ico} ${name}</b><p>${d}</p></div><button class="btn small ${s.focus===name?"primary":""}" data-action="focus" data-id="${name}">${s.focus===name?"Aktiv":"Wählen"}</button></div></div>`).join("")}<button class="btn primary full" data-action="train">▶ Training starten</button></div><div class="card"><div class="between"><h3>✨ Top-Talente</h3><span class="pill">Trainingslevel ${s.facilities.training}</span></div>${s.roster.filter(p=>p.age<=23).sort((a,b)=>b.potential-a.potential).slice(0,8).map(p=>`<div class="line between"><div><b>${e(p.name)}</b><small>${p.age} Jahre · ${p.pos}</small></div><span class="pill">${p.rating} → ${p.potential}</span></div>`).join("")}</div></div>`}
function club(){let info=[["🏟️ Stadionplätze",fmt(7000+s.facilities.stadium*4500)],["📣 Fans",fmt(s.fans)],["🤝 Sponsor",e(s.sponsor)]];return h("VEREINSGELÄNDE","Baue deine Fußballwelt.","Verbessere jedes Gebäude bis Level 10.")+`<div class="grid g3">${info.map(([a,b])=>`<div class="card stat"><div>${a}</div><strong style="font-size:22px">${b}</strong></div>`).join("")}</div><div class="facilitygrid">${FAC.map(([id,ico,name,desc,base])=>{let n=s.facilities[id],cost=Math.round(base*Math.pow(n,1.5)/1000)*1000;return `<div class="card facility"><span class="emoji">${ico}</span><h3>${name}</h3><p>${desc}</p><div class="between"><b>Level ${n}/10</b><small>${n===10?"MAX":fmt(cost)+" 🪙"}</small></div><div class="level">${Array.from({length:10},(_,i)=>`<span class="${i<n?"on":""}"></span>`).join("")}</div><button class="btn primary full" data-action="upgrade" data-id="${id}" ${n===10?"disabled":""}>${n===10?"✓ Voll ausgebaut":"⬆ Ausbauen"}</button></div>`}).join("")}</div><div class="card" style="margin-top:17px"><h3>🤝 Sponsoring</h3><p class="muted smalltxt">Wähle deinen Sponsor für zusätzliche Einnahmen pro Spiel.</p><div class="grid g3">${[["Stadtwerke Nova",5000],["Nordstern Energy",12000],["Hyperdrive Sports",20000]].map(([n,m])=>`<button class="btn ${s.sponsor===n?"primary":""}" data-action="sponsor" data-id="${n}">${n} · ${fmt(m)} 🪙</button>`).join("")}</div></div>`}
function league(){let sched=s.schedule.slice(s.week,s.week+5).map((round,i)=>{let g=round.find(x=>x.includes("me"));let name=id=>id==="me"?s.name:s.clubs.find(c=>c.id===id)?.name;return g?`<div class="line"><small>Spieltag ${s.week+i+1}</small><b>${e(name(g[0]))} – ${e(name(g[1]))}</b></div>`:""}).join("");return h("MEISTERSCHAFT","Der Kampf um den Titel.","Zehn Vereine. Achtzehn Spieltage. Ein Meister.",'<button class="btn primary" data-action="kickoff">▶ Nächstes Spiel</button>')+`<div class="grid g2"><div class="card"><h3>🏆 Ligatabelle</h3>${standings()}</div><div class="card"><h3>📅 Kommende Spiele</h3>${sched}<p class="muted smalltxt">Saisonfortschritt: ${s.week}/18</p><div class="progress"><span style="width:${s.week/18*100}%"></span></div></div></div>`}
function history(){return h("VEREINSCHRONIK","Deine Geschichte.","Alle Ergebnisse und Vereinsereignisse.")+`<div class="grid g2"><div class="card"><h3>⚽ Ergebnisse</h3>${s.history.length?s.history.map(x=>`<div class="line between"><div><small>Saison ${x.season} · Spieltag ${x.week}</small><b>${e(x.home)} ${x.a}:${x.b} ${e(x.away)}</b></div><span class="pill">${x.result==="S"?"SIEG":x.result==="U"?"REMIS":"NIEDERLAGE"}</span></div>`).join(""):`<p class="muted">Noch kein Spiel bestritten.</p>`}</div><div class="card"><h3>📰 Nachrichten</h3>${s.news.map(n=>`<div class="line">${e(n)}</div>`).join("")}</div></div>`}
function settings(){return h("SPIELEINSTELLUNGEN","Dein Verein, deine Regeln.","Passe den Club an und verwalte deine Daten.")+`<div class="grid g2"><div class="card"><h3>⚙️ Vereinsprofil</h3><label>Vereinsname<input id="clubname" maxlength="28" value="${e(s.name)}" style="width:100%;margin-top:8px"></label><p class="muted">Vereinsfarbe</p><div class="colors">${["#278b94","#407ec4","#c55566","#9b73d1","#c89c41","#558f5e"].map(c=>`<button data-action="color" data-id="${c}" style="background:${c};border:${s.color===c?"3px solid white":"1px solid #34556c"}" aria-label="Farbe ${c}"></button>`).join("")}</div><button class="btn primary" data-action="rename">💾 Speichern</button></div><div class="card"><h3>♾️ Spielmodus & Speichern</h3><div class="line between"><div><b>Unbegrenzte Münzen</b><small>Transfers und Ausbau ohne Kosten</small></div><button class="btn ${s.infinite?"primary":""}" data-action="toggle">${s.infinite?"AKTIV ♾️":"Aktivieren"}</button></div><div class="line between"><div><b>Spielstand exportieren</b><small>Speichern als JSON-Datei</small></div><button class="btn small" data-action="export">Export</button></div><div class="line between"><div><b>Spielstand importieren</b><small>Gespeicherte Daten einlesen</small></div><label for="savefile" class="btn small">Import</label><input type="file" id="savefile" accept=".json,application/json" hidden></div><div class="line between"><div><b>Neues Spiel</b><small>Alle Fortschritte zurücksetzen</small></div><button class="btn small" data-action="reset">Neustart</button></div></div></div><p class="muted smalltxt">SIDELINE 26 ist ein eigenständiger Fußballmanager mit fiktiven Vereinen und Spielern. Kein offizielles Produkt von FIRE UP. Deine Spielstände bleiben lokal im Browser.</p>`}
const views={home,team,market,training,club,league,history,settings};
function render(){document.getElementById("root").innerHTML=layout(views[page]())}
function go(p){page=views[p]?p:"home";search="";render();window.scrollTo(0,0)}
function toast(t){let el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2500)}
function record(id,a,b){let x=s.table[id];x.played++;x.for+=a;x.against+=b;if(a>b){x.w++;x.points+=3}else if(a===b){x.d++;x.points++}else x.l++}
function simulated(a,b){let x=0,y=0;for(let i=0;i<17;i++){if(Math.random()<clamp(.07+(a-b)*.0027,.02,.22))x++;if(Math.random()<clamp(.07+(b-a)*.0027,.02,.22))y++}return[x,y]}
function kickoff(){if(match&&!match.done)return;let next=upcoming();if(!next)return;match={next,minute:0,us:0,them:0,style:s.tactic,done:false,log:[`0' – Anpfiff! ${s.name} gegen ${next.opponent.name}.`]};showMatch();match.timer=setInterval(()=>{tick();if(match.minute>=90)finish();showMatch()},440)}
function tick(){let m=match;if(!m||m.done)return;m.minute=Math.min(90,m.minute+5);let edge=(strength()-m.next.opponent.strength)*.003,bias=m.style==="Offensiv"?.025:m.style==="Pressing"?.013:m.style==="Defensiv"?-.025:0;if(Math.random()<clamp(.077+edge+bias,.02,.3)){m.us++;let p=pick(s.starters.map(id=>s.roster.find(p=>p.id===id)).filter(p=>p&&["MID","ATT"].includes(p.pos)));m.log.unshift(`${m.minute}' – ⚽ TOOOOR! ${p?.name||s.name} trifft!`);if(p)p.goals++}else if(Math.random()<clamp(.067-edge-bias*.6,.02,.26)){m.them++;m.log.unshift(`${m.minute}' – ⚽ Gegentor durch ${m.next.opponent.name}.`)}else m.log.unshift(`${m.minute}' – ${pick(["Guter Spielaufbau im Mittelfeld.","Starke Abwehraktion.","Der Ball geht knapp am Tor vorbei.","Die Fans feuern ihre Mannschaft an."])}`);m.log=m.log.slice(0,10)}
function finish(){let m=match;if(!m||m.done)return;clearInterval(m.timer);m.done=true;let g=m.next.f,a=m.next.home?m.us:m.them,b=m.next.home?m.them:m.us;record(g[0],a,b);record(g[1],b,a);for(let g of s.schedule[s.week].filter(g=>!g.includes("me"))){let team1=s.clubs.find(x=>x.id===g[0]),team2=s.clubs.find(x=>x.id===g[1]),[a,b]=simulated(team1.strength,team2.strength);record(g[0],a,b);record(g[1],b,a)}let result=m.us>m.them?"S":m.us<m.them?"N":"U",reward=(result==="S"?45000:result==="U"?22000:10000)+({"Stadtwerke Nova":5000,"Nordstern Energy":12000,"Hyperdrive Sports":20000}[s.sponsor]||5000);s.cash+=reward;s.fans=clamp(s.fans+(result==="S"?rnd(90,200):result==="U"?rnd(10,60):-rnd(5,40))*s.facilities.marketing,300,10000000);for(let p of s.roster)p.fitness=clamp(p.fitness+(s.starters.includes(p.id)?-rnd(7,14)+s.facilities.medical*2:rnd(8,16)),15,100);s.history.unshift({season:s.season,week:s.week+1,home:m.next.home?s.name:m.next.opponent.name,away:m.next.home?m.next.opponent.name:s.name,a:m.next.home?m.us:m.them,b:m.next.home?m.them:m.us,result});s.news.unshift(`${result==="S"?"🏆 Sieg":result==="N"?"⚽ Niederlage":"🤝 Remis"} gegen ${m.next.opponent.name}: ${m.us}:${m.them}`);s.news=s.news.slice(0,30);s.week++;m.reward=reward;if(s.week===18){let rank=sorted().findIndex(t=>t.id==="me")+1;if(rank===1){s.trophies++;m.title="🏆 MEISTER!";s.news.unshift(`${s.name} ist Meister!`)}else m.title=`Saisonende – Platz ${rank}`;s.season++;s.week=0;for(let c of s.clubs)s.table[c.id]={played:0,w:0,d:0,l:0,for:0,against:0,points:0};s.schedule=fixtures();for(let p of s.roster){p.age++;p.fitness=100} s.market=marketPlayers()}else if(s.week%3===0)s.market=marketPlayers();save()}
function showMatch(){let m=match;if(!m)return;let home=m.next.home?s.name:m.next.opponent.name,away=m.next.home?m.next.opponent.name:s.name,a=m.next.home?m.us:m.them,b=m.next.home?m.them:m.us;document.getElementById("modal").innerHTML=`<div class="shade"><div class="dialog" role="dialog" aria-modal="true"><div class="between"><h2>${m.done?"SPIELBERICHT":"🔴 LIVE · "+m.minute+"'"}</h2>${m.done?'<button class="btn small" data-action="close">✕</button>':'<span class="pill">MATCHDAY 26</span>'}</div><div class="score"><strong>${e(home)}</strong><span>${a} : ${b}</span><strong>${e(away)}</strong></div>${m.done?`<div style="text-align:center"><h2>${m.title|| (m.us>m.them?"🎉 SIEG!":m.us<m.them?"💪 NÄCHSTES MAL!":"🤝 REMIS!")}</h2><p>+${fmt(m.reward)} Münzen · Spielstand gespeichert</p></div><button class="btn primary full" data-action="close">Weiter zur Zentrale →</button>`:`<div class="between"><small>SPIELVERLAUF</small><b>${m.minute}' / 90'</b></div><div class="progress"><span style="width:${m.minute/90*100}%"></span></div><div class="commentary">${m.log.map(x=>`<p>${e(x)}</p>`).join("")}</div><p>Spielanweisung</p><div class="filters">${["Kontrolle","Pressing","Konter","Offensiv","Defensiv"].map(x=>`<button class="${m.style===x?"sel":""}" data-action="mode" data-id="${x}">${x}</button>`).join("")}</div><button class="btn full" data-action="skip">⏩ Sofort simulieren</button>`}</div></div>`}
function act(a,id){if(a==="kickoff"){kickoff();return}if(a==="filter"){marketPos=id;render();return}if(a==="refresh"){s.market=marketPlayers();toast("🔎 Neue Spieler entdeckt!")}else if(a==="buy"){let i=s.market.findIndex(x=>x.id===id);if(i<0)return;let p=s.market[i],cost=price(p);if(s.roster.length>=35){toast("Kader ist voll (35 Spieler).");return}if(!s.infinite&&s.cash<cost){toast("Nicht genügend Münzen.");return}if(!s.infinite)s.cash-=cost;s.roster.push(p);s.market.splice(i,1);s.news.unshift(`✍️ ${p.name} wurde verpflichtet.`);toast(`✅ ${p.name} verpflichtet!`)}else if(a==="best"){s.starters=bestXI();toast("Beste Elf aufgestellt!")}else if(a==="start"||a==="bench"){let p=s.roster.find(x=>x.id===id);if(!p)return;if(a==="start"){let old=s.starters.map(x=>s.roster.find(p=>p.id===x)).filter(x=>x?.pos===p.pos).sort((a,b)=>a.rating-b.rating)[0];if(old)s.starters=s.starters.map(x=>x===old.id?id:x);else if(s.starters.length<11)s.starters.push(id);else{toast("Keine passende Position in der Startelf.");return}}else{let replacement=s.roster.filter(x=>x.pos===p.pos&&!s.starters.includes(x.id)).sort((a,b)=>b.rating-a.rating)[0];if(!replacement){toast("Kein Ersatz verfügbar.");return}s.starters=s.starters.map(x=>x===id?replacement.id:x)}toast("Aufstellung geändert.")}else if(a==="focus"){s.focus=id}else if(a==="train"){if(s.focus==="Fitness"){s.roster.forEach(p=>p.fitness=clamp(p.fitness+rnd(15,25)+s.facilities.medical,0,100));toast("⚡ Teamfitness verbessert!")}else{let ps=s.roster.filter(p=>s.focus==="Abschluss"?p.pos==="ATT":s.focus==="Verteidigung"?["DEF","GK"].includes(p.pos):s.focus==="Jugend"?p.age<23:true).sort(()=>Math.random()-.5),count=0;ps.slice(0,2+s.facilities.training).forEach(p=>{let was=p.rating;p.rating=clamp(p.rating+rnd(1,s.facilities.training>=6?3:2),0,Math.max(92,p.potential));p.potential=Math.max(p.potential,p.rating);p.fitness=clamp(p.fitness-rnd(2,7),0,100);if(p.rating>was)count++});toast(`💪 ${count} Spieler verbessert!`)}}else if(a==="upgrade"){let f=FAC.find(x=>x[0]===id),lv=s.facilities[id];if(!f||lv>=10)return;let cost=Math.round(f[4]*Math.pow(lv,1.5)/1000)*1000;if(!s.infinite&&s.cash<cost){toast("Nicht genügend Münzen.");return}if(!s.infinite)s.cash-=cost;s.facilities[id]++;toast(`${f[2]} auf Level ${s.facilities[id]}!`)}else if(a==="sponsor"){s.sponsor=id;toast("Sponsor ausgewählt!")}else if(a==="rename"){let name=document.getElementById("clubname").value.trim();if(name.length<3){toast("Mindestens drei Zeichen eingeben.");return}s.name=name;s.clubs[0].name=name;toast("Vereinsprofil gespeichert.")}else if(a==="color")s.color=id;else if(a==="toggle"){s.infinite=!s.infinite;toast(s.infinite?"♾️ Unbegrenzte Münzen aktiv!":"Normaler Geldmodus.")}else if(a==="reset"){if(!confirm("Wirklich neu anfangen? Der bisherige Fortschritt geht verloren."))return;newGame();page="home";toast("Neues Spiel gestartet.")}else if(a==="export"){let b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),url=URL.createObjectURL(b),x=document.createElement("a");x.href=url;x.download="sideline26-spielstand.json";x.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}else if(a==="mode"){if(match&&!match.done){match.style=id;showMatch()}return}else if(a==="skip"){if(match&&!match.done){while(match.minute<90)tick();finish();showMatch()}return}else if(a==="close"){if(match?.timer)clearInterval(match.timer);match=null;document.getElementById("modal").innerHTML="";render();return}save();render()}
document.addEventListener("click",event=>{let t=event.target.closest("[data-page],[data-action]");if(!t)return;if(t.dataset.page){go(t.dataset.page);return}act(t.dataset.action,t.dataset.id)});
document.addEventListener("input",event=>{if(event.target.id==="marketsearch"){search=event.target.value;let el=document.getElementById("marketcards");if(el)el.innerHTML=cards()}});
document.addEventListener("change",event=>{if(event.target.id==="formation"){s.formation=event.target.value;s.starters=bestXI();save();render()}else if(event.target.id==="tactic"){s.tactic=event.target.value;save();render()}else if(event.target.id==="savefile"&&event.target.files?.[0]){let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(x.version!==3||!Array.isArray(x.roster)||x.roster.length<11||!Array.isArray(x.schedule)||!x.table)throw Error("bad");if(!confirm("Bisherigen Spielstand ersetzen?"))return;s=x;save();go("home");toast("Importiert!") }catch(err){toast("Ungültiger Spielstand.")}};reader.readAsText(event.target.files[0])}});
load();render();if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();</script></body></html>
