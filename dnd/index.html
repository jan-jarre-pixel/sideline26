<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charakterbögen</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4efe6;--card:#fffdf8;--ink:#2a2118;--mut:#7a6d5d;--acc:#8a2b1f;--line:#dccfba;--ok:#2f6b3a}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1713;--card:#25201a;--ink:#eee3d0;--mut:#a39682;--acc:#e0705f;--line:#3d352b;--ok:#7bc58a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1713;--card:#25201a;--ink:#eee3d0;--mut:#a39682;--acc:#e0705f;--line:#3d352b;--ok:#7bc58a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif}
main{max-width:980px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button{flex:1;min-width:96px;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:8px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.name{font-size:26px;margin:0;line-height:1.1}.sub{color:var(--mut);font-size:13px;margin-top:3px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.abs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ab,.st{text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.ab b{display:block;font-size:20px}.st b{display:block;font-size:19px}small{color:var(--mut);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
button.b,input,select,textarea{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px}
button.b{cursor:pointer}button.b:active{background:var(--acc);color:#fff}
input.n{width:70px}textarea{width:100%;min-height:90px}input.w{width:100%}
.hp{font-size:34px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.pip{display:inline-block;width:22px;height:22px;border:2px solid var(--acc);border-radius:50%;margin:2px 3px 2px 0;cursor:pointer;vertical-align:middle}.pip.u{background:var(--acc);opacity:.35}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.ln span:first-child{color:var(--mut)}.ln em{font-style:normal;color:var(--acc);margin-right:4px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:4px;border-bottom:1px dotted var(--line)}th{color:var(--mut);font-weight:400;font-size:12px}
.f{margin:0 0 8px}.f b{color:var(--acc)}.tag{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:2px 3px 2px 0;font-size:13px}
.note{font-size:13px;color:var(--mut)}.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.ed label{font-size:12px;color:var(--mut);display:block}
#st{font-size:12px;color:var(--mut);margin:0 0 8px}
main{padding-bottom:96px}
.act{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}.act b{display:block}.act p{margin:2px 0 6px;font-size:13px;color:var(--mut)}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:12px 0 6px}
#dfab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:24px;z-index:20;cursor:pointer}
#dpan{display:none;position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 28px));max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:20}
#toast{display:none;position:fixed;left:14px;right:80px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;z-index:21;font-size:14px}
#dlog div{font-size:13px;padding:2px 0;border-bottom:1px dotted var(--line)}
#dice{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.45);cursor:pointer}
.die{width:120px;height:120px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}
.die.roll{animation:dspin .8s cubic-bezier(.2,.7,.3,1)}.die.land{animation:dpop .4s}.die.crit{background:#d4a017;color:#222}.die.fail{background:#555}
@keyframes dspin{from{transform:rotate(0) scale(.5) translateY(80px)}to{transform:rotate(900deg) scale(1) translateY(0)}}
@keyframes dpop{0%{transform:scale(.8)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.dl{color:#fff;margin-top:16px;max-width:90%;text-align:center;font-size:15px;text-shadow:0 1px 4px #000}
@media (prefers-reduced-motion:reduce){.die.roll,.die.land{animation:none}}
#account:empty{display:none}
button:disabled,button.b:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:600px){.card{overflow-wrap:anywhere}#sheet table{display:block;overflow-x:auto}}
</style>
</head>

function setSt(t){document.getElementById("st").textContent=t}
function skb(c,s,pb){const b=mod(c.ab[s[1]]),l=(c.sk||{})[s[0]]||0;
 if(l==2)return[b+2*pb,"●●"];if(l==1)return[b+pb,"●"];if(c.joat)return[b+Math.floor(pb/2),"½"];return[b,""]}
function pips(kind,i,n,used,id){let h="";for(let j=0;j<n;j++)h+=`<span class="pip ${j<used?"u":""}" onclick="pip('${id}','${kind}',${i},${j})"></span>`;return h}
function pip(id,k,i,j){const c=own(id),u=c[k][i]||0;c[k][i]=j<u?u-1:u+1;save(id);draw()}
function hp(id,s){const c=own(id);let v=parseInt(document.getElementById("amt").value)||0;if(!v)return;
 if(s<0){const a=Math.min(c.tmp,v);c.tmp-=a;v-=a;c.hp=Math.max(0,c.hp-v)}else c.hp=Math.min(c.hpMax,c.hp+v);save(id);draw()}
function adj(id,k,d,min,max){const c=own(id);c[k]=Math.min(max??1e9,Math.max(min??0,(c[k]||0)+d));save(id);draw()}
function ds(id,t,i){const c=own(id);c.ds[t]=c.ds[t]==i+1?i:i+1;save(id);draw()}
function insp(id){const c=own(id);c.insp=c.insp?0:1;save(id);draw()}
function rest(id,t){const c=own(id);
 parts(c.sl).forEach((p,i)=>{if(t=="l"||p[2]=="sr")c.slU[i]=0});
 parts(c.rs).forEach((p,i)=>{if(t=="l"||p[2]=="sr")c.rsU[i]=0;else if(p[2]=="sr1")c.rsU[i]=Math.max(0,(c.rsU[i]||0)-1)});
 if(t=="l"){c.hp=c.hpMax;c.tmp=0;c.hdUsed=Math.max(0,c.hdUsed-Math.ceil(c.lvl/2));c.ds=[0,0]}save(id);draw()}
function setv(el){const id=cur,c=own(id),k=el.dataset.k.split(".");let v=el.type=="checkbox"?+el.checked:el.type=="number"||el.tagName=="SELECT"?+el.value:el.value;
 let o=c;for(let i=0;i<k.length-1;i++)o=o[k[i]]??(o[k[i]]={});o[k[k.length-1]]=v;save(id)}
function tog(){edit=!edit;draw()}
function f(label,k,v,t){return`<div><label>${label}</label><input class="w" data-k="${k}" type="${t||"text"}" value="${esc(v)}" oninput="setv(this)"></div>`}
function overview(){const ids=Object.keys(S);
 return`<div class="card"><h3>Gruppenübersicht</h3>`+(ids.length?`<table><tr><th>Charakter</th><th>Stufe</th><th>TP</th><th>RK</th><th>Pass. Wahrn.</th><th>Zauberplätze frei</th></tr>`+ids.map(id=>{const c=S[id],pb=pbOf(c),pw=10+skb(c,SK[17],pb)[0];
 const sl=parts(c.sl).map((p,i)=>`${p[0]}: ${(+p[1])-(c.slU[i]||0)}/${p[1]}`).join(", ")||"–";
 return`<tr onclick="cur='${id}';draw()" style="cursor:pointer"><td><b>${esc(c.name)}${id.startsWith("tpl_")?" (Vorlage)":""}</b><br><small>${esc(c.cls)}${c.player?" · "+esc(c.player):""}</small></td><td>${c.lvl}</td><td>${c.hp}/${c.hpMax}${c.tmp?` (+${c.tmp})`:""}</td><td>${c.ac}</td><td>${pw}</td><td>${sl}</td></tr>`}).join("")+`</table>`:`<p class="note">Noch hat niemand einen Charakter gewählt.</p>`)+`<p class="note">Spieler schicken dir ihren Code (Button „Code erzeugen“ in ihrem Bogen), den du unten einfügst. So siehst du ihren aktuellen Stand. Jeder Spieler sieht und ändert ausschließlich seinen eigenen.</p></div>${codeCard()}`}
function picker(){return`<div class="card"><h3>Wähle deinen Charakter</h3><div class="grid">`+IDS.map(k=>{const d=D[k],t=CL[k]&&CL[k].uid!=me;return`<div class="act"><b>${esc(d.name)}</b><p>${esc(d.cls)} · ${esc(d.race)}</p><button class="b" ${t?"disabled":""} onclick="claim('${k}')">${t?"Schon vergeben":"Das bin ich"}</button></div>`}).join("")+`</div></div>`}
async function claim(k){try{await db.doc("claims/"+k).set({uid:me});const x=clone(D[k]);x.char=k;await db.doc("sheets/"+me).set(x)}catch(e){setSt("Auswahl nicht möglich – Contributor-Rechte nötig.")}}
function tst(t){const o=document.getElementById("toast");o.textContent=t;o.style.display="block";clearTimeout(o._t);o._t=setTimeout(()=>o.style.display="none",2600)}
function cast(id,l,f,n){const c=own(id),sl=parts(c.sl),i=sl.findIndex(p=>+p[0]==l);if(i<0)return;
 const u=c.slU[i]||0;if(u>=(+sl[i][1]||0))return;c.slU[i]=u+1;save(id);draw();
 if(f)rl(f,n+" (Platz Stufe "+l+")");else tst(n+": Zauberplatz Stufe "+l+" verbraucht")}
function spb(id,c,t,n){if(!t)return"";const sl=parts(c.sl);
 return`<div class="note" style="margin:6px 0 4px">Kostet 1 Zauberplatz. Wirkung je Platzstufe:</div><div class="row">`+t.split(";").map(x=>x.split("~")).filter(x=>x.length>=3).map(([l,f,x])=>{
 const i=sl.findIndex(p=>+p[0]==+l),fr=i<0?0:(+sl[i][1]||0)-(c.slU[i]||0);
 return`<button class="b" ${fr?"":"disabled"} onclick="cast('${id}',${+l},decodeURIComponent('${jsArg(f)}'),decodeURIComponent('${jsArg(n)}'))">Stufe ${l}: ${esc(x)} <small>(${fr} frei)</small></button>`}).join("")+`</div>`}
function combat(id,c,pb,m){
 const sl=parts(c.sl),rs=parts(c.rs),acts=parts(c.cb||(D[c.char||id]||{}).cb||""),ini=m[1]+c.initX;
 const cats=[...new Set(["Aktion","Bonusaktion","Reaktion","Zauber","Sonstiges",...acts.map(a=>a[0])])];
 const g=cats.map(k=>{const l=acts.filter(a=>a[0]==k);return l.length?`<div class="cat">${esc(k)}</div>`+l.map(a=>`<div class="act"><b>${esc(a[1])}</b><p>${esc(a[2])}</p><div class="row">${[a[3],a[4]].filter(Boolean).map(r=>`<button class="b" onclick="roll(decodeURIComponent('${jsArg(r)}'),decodeURIComponent('${jsArg(a[1])}'))">🎲 ${esc(r)}</button>`).join("")}</div>${spb(id,c,a[5],a[1])}</div>`).join(""):""}).join("");
 return`<div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:24px">${c.hp}/${c.hpMax} TP${c.tmp?` <span style="color:var(--acc)">+${c.tmp}</span>`:""}</b><span>RK <b>${c.ac}</b></span></div><div class="bar"><i style="width:${Math.round(c.hp/c.hpMax*100)}%"></i></div>
 <div class="row"><input id="amt" class="n" type="number" min="0" placeholder="Zahl"><button class="b" onclick="hp('${id}',-1)">Schaden</button><button class="b" onclick="hp('${id}',1)">Heilen</button><button class="b" onclick="roll('1d20${sg(ini)}','Initiative')">Initiative ${sg(ini)}</button><button class="b" onclick="roll('1d20','Todesrettung')">Todesrettung</button></div>
 <div style="margin-top:6px">${sl.map((p,i)=>`<div class="ln"><span>Zauberplätze Stufe ${esc(p[0])}</span><span>${pips("slU",i,+p[1]||0,c.slU[i]||0,id)}</span></div>`).join("")}${rs.map((p,i)=>`<div class="ln"><span>${esc(p[0])}</span><span>${pips("rsU",i,+p[1]||0,c.rsU[i]||0,id)}</span></div>`).join("")}</div></div>`+g}
function sheet(id){
 const c=get(id),pb=pbOf(c),m=c.ab.map(mod),pw=10+skb(c,SK[17],pb)[0],pct=Math.round(c.hp/c.hpMax*100);
 const sk=SK.map(k=>{const [b,t]=skb(c,k,pb);return`<div class="ln" ${edit?"":`style="cursor:pointer" onclick="roll('1d20${sg(b)}','${k[0]}')"`}><span>${t?`<em>${t}</em>`:""}${k[0]} <small>(${AB[k[1]]})</small></span>${edit?`<select data-k="sk.${k[0]}" onchange="setv(this)">${["–","geübt","Expertise"].map((x,i)=>`<option value="${i}" ${((c.sk||{})[k[0]]||0)==i?"selected":""}>${x}</option>`).join("")}</select>`:`<b>${sg(b)}</b>`}</div>`}).join("");
 const sv=AB.map((a,i)=>`<div class="ln" ${edit?"":`style="cursor:pointer" onclick="roll('1d20${sg(m[i]+(c.sv[i]?pb:0))}','RW ${a}')"`}><span>${c.sv[i]?"<em>●</em>":""}${a}</span>${edit?`<input type="checkbox" data-k="sv.${i}" ${c.sv[i]?"checked":""} onchange="setv(this)">`:`<b>${sg(m[i]+(c.sv[i]?pb:0))}</b>`}</div>`).join("");
 const spP=parts(c.sp.replace(/:/g,"|")),has=spP.length>0,sa=c.sa??5;
 const spl=l=>spP.filter(p=>p[0]==l).map(p=>p[1]).filter(Boolean);
 const slots=parts(c.sl),res=parts(c.rs);
 const head=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2 class="name">${esc(c.name)}</h2><div class="sub">${esc(c.cls)} · Stufe ${c.lvl} · ${esc(c.race)} · ${esc(c.bg)}${c.player?` · ${esc(c.player)}`:""}</div></div>
 <div class="row"><button class="b" onclick="insp('${id}')">${c.insp?"★":"☆"} Inspiration</button><button class="b" onclick="rest('${id}','s')">Kurze Rast</button><button class="b" onclick="rest('${id}','l')">Lange Rast</button><button class="b" onclick="view=view=='cb'?'sheet':'cb';edit=false;draw()">${view=="cb"?"Bogen":"Kampfmodus"}</button><button class="b" onclick="tog()">${edit?"Fertig":"Bearbeiten"}</button></div></div></div>`;
 if(view=="cb"&&!edit)return head+combat(id,c,pb,m);
 const editor=edit?`<div class="card"><h3>Stammdaten bearbeiten</h3><div class="ed">${f("Name","name",c.name)}${f("Spieler/in","player",c.player)}${f("Klasse / Unterklasse","cls",c.cls)}${f("Volk","race",c.race)}${f("Hintergrund","bg",c.bg)}${f("Stufe","lvl",c.lvl,"number")}${f("Rüstungsklasse","ac",c.ac,"number")}${f("Initiative-Extra","initX",c.initX,"number")}${f("Bewegungsrate","speed",c.speed)}${f("TP Maximum","hpMax",c.hpMax,"number")}${f("Trefferwürfel (Seiten)","hd",c.hd,"number")}${f("Jack of All Trades (1/0)","joat",c.joat,"number")}
 <div><label>Zauberattribut</label><select data-k="sa" onchange="setv(this)">${AB.map((a,i)=>`<option value="${i}" ${sa==i?"selected":""}>${a}</option>`).join("")}</select></div></div>
 <div class="ed" style="margin-top:8px">${c.ab.map((a,i)=>f(AB[i],"ab."+i,a,"number")).join("")}</div></div>`:"";
 const txt=(label,k,hint)=>`<div class="card"><h3>${label}</h3>${edit?`<textarea data-k="${k}" oninput="setv(this)">${esc(c[k])}</textarea><div class="note">${hint}</div>`:""}</div>`;
 return head+editor+`<div class="card"><div class="abs">${c.ab.map((a,i)=>`<div class="ab"><small>${AB[i]}</small><b>${sg(m[i])}</b><small>${a}</small></div>`).join("")}</div></div>
 <div class="card"><div class="stats"><div class="st"><small>Rüstungsklasse</small><b>${c.ac}</b></div><div class="st"><small>Initiative</small><b>${sg(m[1]+c.initX)}</b></div><div class="st"><small>Übungsbonus</small><b>${sg(pb)}</b></div><div class="st"><small>Passive Wahrn.</small><b>${pw}</b></div><div class="st" style="grid-column:span 2"><small>Bewegungsrate</small><b style="font-size:15px">${esc(c.speed)}</b></div></div></div>
 <div class="grid"><div>
 <div class="card"><h3>Lebenspunkte</h3><div class="hp">${c.hp}<span style="font-size:18px;color:var(--mut)"> / ${c.hpMax}</span>${c.tmp?`<span style="font-size:16px;color:var(--acc)"> +${c.tmp} temp</span>`:""}</div><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="row"><input id="amt" class="n" type="number" min="0" placeholder="Zahl"><button class="b" onclick="hp('${id}',-1)">Schaden</button><button class="b" onclick="hp('${id}',1)">Heilen</button><button class="b" onclick="adj('${id}','tmp',1)">+1 temp</button><button class="b" onclick="adj('${id}','tmp',-1)">−1 temp</button></div>
 <div class="row" style="margin-top:8px"><span class="note">Trefferwürfel ${c.lvl}W${c.hd}: ${c.lvl-c.hdUsed} übrig</span><button class="b" onclick="adj('${id}','hdUsed',1,0,${c.lvl})">verbraucht</button><button class="b" onclick="adj('${id}','hdUsed',-1,0,${c.lvl})">zurück</button></div>
 <div style="margin-top:8px"><span class="note">Todesrettungen Erfolge</span> ${[0,1,2].map(i=>`<span class="pip ${c.ds[0]>i?"u":""}" onclick="ds('${id}',0,${i})"></span>`).join("")} <span class="note">Fehlschläge</span> ${[0,1,2].map(i=>`<span class="pip ${c.ds[1]>i?"u":""}" onclick="ds('${id}',1,${i})"></span>`).join("")}</div></div>
 ${slots.length||res.length?`<div class="card"><h3>Ressourcen</h3>${slots.map((p,i)=>`<div class="ln"><span>Zauberplätze Stufe ${esc(p[0])}</span><span>${pips("slU",i,+p[1]||0,c.slU[i]||0,id)}</span></div>`).join("")}${res.map((p,i)=>`<div class="ln"><span>${esc(p[0])}</span><span>${pips("rsU",i,+p[1]||0,c.rsU[i]||0,id)}</span></div>`).join("")}</div>`:""}
 <div class="card"><h3>Angriffe</h3><table><tr><th>Name</th><th>Treffer</th><th>Schaden</th></tr>${parts(c.atk).map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2])}</td></tr>`).join("")}</table></div>
 <div class="card"><h3>Rettungswürfe</h3>${sv}</div></div><div>
 <div class="card"><h3>Fertigkeiten</h3>${sk}<div class="note" style="margin-top:6px">● geübt · ●● Expertise${c.joat?" · ½ Jack of All Trades":""}</div></div>
 ${has?`<div class="card"><h3>Zauber · SG ${8+pb+m[sa]} · Angriff ${sg(pb+m[sa])} · ${AB[sa]}</h3>${spl("0").length?`<div class="note">Zaubertricks</div>${spl("0").map(x=>`<span class="tag">${esc(x)}</span>`).join("")}`:""}${[1,2,3,4,5,6,7,8,9].map(l=>spl(String(l)).length?`<div class="note" style="margin-top:6px">Stufe ${l}</div>${spl(String(l)).map(x=>`<div class="ln"><span style="color:var(--ink)">${esc(x)}</span></div>`).join("")}`:"").join("")}</div>`:""}
 </div></div>`+
 (edit?txt("Angriffe","atk","Pro Zeile: Name | Bonus | Schaden")+txt("Zauber","sp","Pro Zeile: Stufe: Name (0 = Zaubertrick)")+txt("Zauberplätze","sl","Pro Zeile: Stufe | Anzahl | lr (lange Rast) oder sr (kurze Rast)")+txt("Klassenressourcen","rs","Pro Zeile: Name | Anzahl | lr, sr oder sr1 (1 Anwendung pro kurzer Rast)")+txt("Kampfaktionen","cb","Pro Zeile: Kategorie | Name | Beschreibung | Wurf 1 | Wurf 2 | Platzstufen (Würfe optional, z. B. 1d20+5; Platzstufen z. B. 1~2d8~2W8 Schaden;2~3d8~3W8 Schaden)")+txt("Sprachen & Übungen","langs",""):"")+
 `<div class="card"><h3>Merkmale</h3>${edit?`<textarea data-k="ft" oninput="setv(this)">${esc(c.ft)}</textarea><div class="note">Pro Zeile ein Merkmal, z. B. Neues Talent oder Level-4-Feature.</div>`:lines(c.ft).map(l=>{const i=l.indexOf(":");return i>0&&i<45?`<p class="f"><b>${esc(l.slice(0,i))}:</b>${esc(l.slice(i+1))}</p>`:`<p class="f">${esc(l)}</p>`}).join("")}</div>
 ${edit?"":`<div class="card"><h3>Sprachen &amp; Übungen</h3><div class="note">${esc(c.langs)}</div></div>`}
 <div class="card"><h3>Ausrüstung &amp; Items</h3>${edit?`<textarea data-k="gear" oninput="setv(this)">${esc(c.gear)}</textarea>`:`<div style="white-space:pre-wrap">${esc(c.gear)}</div>`}</div>
 <div class="card"><h3>Notizen</h3><textarea data-k="n" oninput="setv(this)" placeholder="Hintergrund, Bindungen, Session-Notizen …">${esc(c.n)}</textarea></div>${codeCard()}`}
function draw(soft){
 const a=document.activeElement;if(soft&&a&&a.closest&&a.closest("#sheet")&&/INPUT|TEXTAREA/.test(a.tagName)&&a.id!="amt")return;
 const ids=Object.keys(S),nav=document.getElementById("nav"),sh=document.getElementById("sheet");
 if(!mode){nav.innerHTML="";sh.innerHTML=chooser();return}
 if(isDM)nav.innerHTML=`<button class="${cur=="all"?"on":""}" onclick="cur='all';draw()">Übersicht</button>`+ids.map(id=>`<button class="${id==cur?"on":""}" onclick="cur='${id}';edit=false;draw()">${esc(S[id].name)}${id.startsWith("tpl_")?" (Vorlage)":""}</button>`).join("");else nav.innerHTML="";
 if(!isDM){if(!ids.length){sh.innerHTML=db?picker():"";return}cur=ids[0]}
 else if(cur!="all"&&!S[cur])cur="all";
 sh.innerHTML=cur=="all"?overview():sheet(cur)}
let mode="",mchar="";
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}};
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(t){return JSON.parse(decodeURIComponent(escape(atob(t.trim()))))}
function codeCard(){return`<div class="card"><h3>Stand sichern &amp; weitergeben</h3><div class="note">Mit dem Code kann ein Stand auf ein anderes Gerät oder zum Spielleiter. Alles wird sonst nur in diesem Browser gespeichert.</div><textarea id="code" placeholder="Code hier einfügen"></textarea><div class="row">${S[cur]?`<button class="b" onclick="mk()">Code erzeugen &amp; kopieren</button>`:""}<button class="b" onclick="imp()">Code laden</button></div></div>`}
function mk(){if(!S[cur])return;const c=document.getElementById("code");c.value=enc(S[cur]);c.select();try{navigator.clipboard.writeText(c.value);setSt("Code kopiert")}catch(e){setSt("Code markieren und kopieren")}}
function imp(){try{const c=dec(document.getElementById("code").value),k=c.char;if(!IDS.includes(k)||(!isDM&&k!=mchar))throw 0;S[k]=c;save(k);cur=isDM?k:cur;draw();setSt("Code geladen")}catch(e){setSt("Code ungültig oder gehört zu einem anderen Charakter")}}
function chooser(){return`<div class="card"><h3>Wer bist du?</h3><div class="grid">`+IDS.map(k=>`<div class="act"><b>${esc(D[k].name)}</b><p>${esc(D[k].cls)} · ${esc(D[k].race)}</p><button class="b" onclick="pick('${k}')">Das bin ich</button></div>`).join("")+`</div><p class="note" style="margin-top:10px">Spielleiter? <button class="b" onclick="ls('mode','d');start()">Spielleiter-Ansicht</button></p></div>`}
function pick(k){ls("mode","p");ls("mchar",k);start()}
function load(k){let x=null;try{x=JSON.parse(ls("i_"+k))}catch(e){}x=x||clone(D[k]);x.char=k;S[k]=x}
function start(){mode=ls("mode");mchar=ls("mchar");S={};
 if(mode=="d"){isDM=true;IDS.forEach(load);cur="all"}else if(mode=="p"&&IDS.includes(mchar)){isDM=false;load(mchar);cur=mchar}else mode="";
 draw()}
start();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<script defer src="config.js"></script>
<script defer src="online.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
/* Uses the existing character-sheet dice buttons, but delegates the actual dice roll
   to a trusted Supabase RPC while a player or GM is signed in. */
(() => {
  'use strict';
  const cfg=window.DND_CLOUD_CONFIG||{};
  if (!window.supabase?.createClient||!cfg.url||!cfg.publishableKey)return;
  const api=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:false,autoRefreshToken:false}});
  let pending=false;
  const status=message=>{try{setSt(message);tst(message);}catch{}};
  window.DND_ONLINE_ROLL=async (formula,label)=>{
    if(pending)return;
    let saved;
    try{saved=JSON.parse(localStorage.getItem('dnd_characters_cloud_v2')||'null');}catch{}
    const actor=saved?.role==='gm'?'gm':saved?.char;
    if(!['len','gra','sas','pei','gm'].includes(actor)||typeof saved?.code!=='string'){
      status('Bitte zuerst mit deinem privaten Code anmelden.');return;
    }
    const f=String(formula||'').replace(/\s/g,'').toLowerCase();
    const name=String(label||'Freier Wurf').slice(0,100);
    const advantage=(/^1?d20(?:[+-]\d+)?$/.test(f)&&typeof advm!=='undefined')?Number(advm)||0:0;
    pending=true;status('Wurf wird sicher auf dem Server erzeugt …');
    try{
      const {data,error}=await api.rpc('dnd_roll',{
        p_actor:actor,p_code:saved.code,p_formula:f,p_label:name||'Freier Wurf',
        p_visibility:'public',p_request_id:crypto.randomUUID(),p_adv:advantage
      });
      if(error)throw error;
      const raw=Array.isArray(data.individual_rolls)?data.individual_rolls:[];
      const chosen=Array.isArray(data.chosen_rolls)?data.chosen_rolls:raw;
      const faces=Number(data.faces)||20,bonus=Number(data.modifier)||0,total=Number(data.total)||0;
      const resultType=faces===20&&chosen.length===1?(chosen[0]===20?' ★ Krit!':chosen[0]===1?' ✖ Patzer':''):'';
      const details=`${name}: ${data.formula} → [${raw.join(', ')}]${bonus?' ('+(bonus>0?'+':'')+bonus+')':''} = ${total}${resultType}`;
      hist.unshift(details);hist.length=Math.min(hist.length,10);
      const log=document.getElementById('dlog');
      if(log)log.innerHTML=hist.map(x=>`<div>${esc(x)}</div>`).join('');
      anim(total,faces,details,resultType);
      setSt('Wurf für alle Spieler gespeichert ✓');
    }catch(e){
      const message=String(e?.message||'Unbekannter Fehler');
      status(/Sitzung starten|Spielleiter muss Sitzung starten/.test(message)?'Noch keine aktive Spielsitzung. Bitte den Spielleiter starten lassen.':
        'Live-Wurf fehlgeschlagen: '+message.slice(0,120));
    }finally{pending=false;}
  };
})();
